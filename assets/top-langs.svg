<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7aa2f7; }
    .lang-name { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c0caf5; }
    .lang-pct { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7dcfff; }
  </style>

  <rect width="495" height="195" rx="10" fill="#1a1b26" stroke="#24283b" stroke-width="1"/>

  <text x="30" y="38" class="header">Langages les plus utilisés</text>

  <!-- Progress Bar Container -->
  <g transform="translate(30, 56)">
    <rect width="435" height="10" rx="5" fill="#24283b"/>
    <!-- Java: 32% (140px) -->
    <rect x="0" width="140" height="10" rx="5" fill="#b07219"/>
    <!-- Python: 28% (122px) -->
    <rect x="142" width="122" height="10" rx="0" fill="#3572A5"/>
    <!-- HTML/CSS: 24% (104px) -->
    <rect x="266" width="104" height="10" rx="0" fill="#e34c26"/>
    <!-- JS: 16% (63px) -->
    <rect x="372" width="63" height="10" rx="5" fill="#f1e05a"/>
  </g>

  <!-- Legend Column 1 -->
  <g transform="translate(35, 90)">
    <!-- Java -->
    <circle cx="6" cy="6" r="5" fill="#b07219"/>
    <text x="18" y="10" class="lang-name">Java :</text>
    <text x="130" y="10" class="lang-pct">32.0%</text>

    <!-- Python -->
    <circle cx="6" cy="38" r="5" fill="#3572A5"/>
    <text x="18" y="42" class="lang-name">Python :</text>
    <text x="130" y="42" class="lang-pct">28.0%</text>

    <!-- C & SQL -->
    <circle cx="6" cy="70" r="5" fill="#555555"/>
    <text x="18" y="74" class="lang-name">C / SQL :</text>
    <text x="130" y="74" class="lang-pct">4.0%</text>
  </g>

  <!-- Legend Column 2 -->
  <g transform="translate(265, 90)">
    <!-- HTML5 / CSS3 -->
    <circle cx="6" cy="6" r="5" fill="#e34c26"/>
    <text x="18" y="10" class="lang-name">HTML / CSS :</text>
    <text x="130" y="10" class="lang-pct">22.0%</text>

    <!-- JavaScript Vanilla -->
    <circle cx="6" cy="38" r="5" fill="#f1e05a"/>
    <text x="18" y="42" class="lang-name">JavaScript :</text>
    <text x="130" y="42" class="lang-pct">14.0%</text>
  </g>
</svg>